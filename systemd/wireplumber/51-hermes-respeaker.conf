# Keep WirePlumber's hands off the ReSpeaker 2-Mic HAT.
#
# WHY. The WM8960's DAC is not connected to its output mixer by default and its
# volumes come up at 0% (headphone) and 82% (speaker), so the card has to be
# configured before it makes any sound. scripts/audio-setup.sh does that at
# boot -- and MEASURED, it loses: the unit ran at 8.33 s, wireplumber started
# at 7.83 s, and wireplumber enumerates ALSA cards ASYNCHRONOUSLY after its own
# startup. It therefore claims the card some time after the script has finished
# and applies its own stored volume (0.40), silently undoing everything. Both
# volumes were back at driver defaults after a reboot, which means no sound at
# all from the 3.5 mm jack.
#
# Ordering the unit later would just be racing a race. Excluding the card is
# the honest fix, and it is also the right architecture here: this HAT exists
# for the voice pipeline, which wants direct predictable ALSA access to the
# mics -- not a session manager that can resample it, change its gain, or hand
# it to another client. It is the same rule the camera follows, where exactly
# one process owns the sensor.
#
# HDMI audio is deliberately NOT excluded; wireplumber can keep managing that.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-soc_107c000000_sound" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
