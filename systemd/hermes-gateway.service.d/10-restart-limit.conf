# Hermes Pi — restart rate limiting for the gateway.
#
# WHY THIS EXISTS
# Hermes' generated unit ships `StartLimitIntervalSec=0`, which DISABLES
# systemd's start rate limiter, alongside `Restart=always`. A gateway that
# crashes on startup (bad token, corrupt config, expired auth) would then
# restart every 5s indefinitely: CPU burn, log spam, SD-card wear, and no
# terminal state for the display to report honestly.
#
# With these settings, 5 failures inside 300s puts the unit into `failed`
# and it stays there. That is deliberate: a persistently broken gateway
# needs a human, and the display renders a distinct FAILED screen rather
# than an ever-optimistic "reconnecting".
#
# A genuine crash loop blows through the budget in ~25s. Transient causes
# (network not up yet at boot) are already covered by the unit's
# After=network-online.target and cost at most a couple of the 5 attempts.
#
# Installed as a drop-in, NOT an edit to the generated unit, so that
# `hermes update` / `hermes gateway install --force` cannot silently
# revert it.
#
# Recovery after a trip:  systemctl --user reset-failed hermes-gateway
#                         systemctl --user start hermes-gateway

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5
