# Keep the camera sensor powered continuously.
#
# The CAM light on the panel will be lit permanently, which is correct and is
# the point: it reads the kernel's runtime power state, so it cannot be on
# without saying so. Remove this file and restart to go back to the lazy
# lifecycle (sensor closed at rest, opens on demand, sleeps after 20 s).
[Service]
Environment=HERMES_CAMERA_ALWAYS_ON=on
