# OPT-IN, NOT INSTALLED BY DEFAULT. Copy to
#   ~/.config/systemd/user/hermes-camera.service.d/
# and restart hermes-camera to enable.
#
# You almost certainly do NOT need this. The sensor already wakes whenever
# anything is using it -- a gesture client, the browser view, or a look
# request -- and sleeps ~20 s after the last one leaves. For gestures the two
# are identical while your client is connected, which is the whole time it
# matters.
#
# What this changes is only what happens when NOTHING is connected: the sensor
# stays powered on an empty room, and the panel's CAM light stays lit
# permanently. That light reads the kernel's power state and is the one
# indicator in this project that cannot be made to lie -- leaving it on
# constantly drains the meaning out of it.
[Service]
Environment=HERMES_CAMERA_ALWAYS_ON=on
