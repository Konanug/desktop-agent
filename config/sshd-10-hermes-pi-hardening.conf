# Hermes Pi — SSH hardening.
#
# ORDERING MATTERS. sshd reads Include'd files in lexical order and the FIRST
# obtained value for a keyword wins. 50-cloud-init.conf sets
# "PasswordAuthentication yes", so any override must live in a file sorting
# BEFORE it -- hence the 10- prefix. A 99- file would be silently ignored and
# would look configured while changing nothing.

# Root should never log in over SSH. Administration is via the alanmyin
# account plus sudo. Was "without-password" (key-based root login permitted).
PermitRootLogin no

# PasswordAuthentication is deliberately NOT set here yet. It is switched to
# "no" only after a working public key is installed and verified in a second
# session -- disabling it first would lock this box out entirely, since
# ~/.ssh/authorized_keys was empty as of 2026-08-04.
