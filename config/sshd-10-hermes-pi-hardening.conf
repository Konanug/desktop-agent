# Hermes Pi — SSH hardening.
#
# ORDERING MATTERS. sshd reads Include'd files in lexical order and the FIRST
# obtained value for a keyword wins. 50-cloud-init.conf sets
# "PasswordAuthentication yes", so this file MUST sort before it -- hence the
# 10- prefix. A 99- file would be silently ignored: it would look configured
# while changing nothing. Always verify with `sudo sshd -T`, never by reading
# the config files.

# Key-only authentication. Enabled 2026-08-04 only AFTER verifying key login
# worked, confirmed in the auth log:
#   Accepted publickey for alanmyin ... ED25519 SHA256:E8othIIqyxCRYT...
# Installed key: ~/.ssh/authorized_keys (600), ~/.ssh (700).
PasswordAuthentication no

# Close the PAM back door. With UsePAM yes, keyboard-interactive can still
# reach the password stack even when PasswordAuthentication is no -- leaving
# the box brute-forceable despite appearing locked down.
KbdInteractiveAuthentication no

# Root logs in via no channel. Administration is alanmyin + sudo.
# Was "without-password" (key-based root login was permitted).
PermitRootLogin no
